# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# API-only blueprint: syncing this file does not create a paid render worker.
# Free compute is for a controlled demo; public-launch capacity needs review.
# Current free-only setup uses deploy/oracle-free; do not import render-worker.yaml.
# Durable state lives in the
# externally managed Neon, Upstash, Cloudflare R2, and Pinata services.
services:
  - type: web
    name: ziipa-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/livez
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        value: https://ziipa.com,https://www.ziipa.com
      - key: MOBILE_WEB_ORIGIN
        value: https://app.ziipa.com
      - key: API_PUBLIC_ORIGIN
        value: https://api.ziipa.com
      - key: PUBLIC_APP_URL
        value: https://ziipa.com
      - key: EMAIL_FROM
        value: Ziipa <accounts@ziipa.com>
      - key: SECURE_COOKIES
        value: "true"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: ENABLE_DEMO_CATALOG
        value: "false"
      - key: MEDIA_STORAGE_BACKEND
        value: r2
      - key: R2_BUCKET_NAME
        value: ziipa-media
      # Ledger limits include uploads, reservations and rendered outputs.
      # They do not measure orphaned/external R2 objects or cap provider billing.
      - key: MEDIA_OWNER_MAX_BYTES
        value: "1073741824"
      - key: MEDIA_PROJECT_MAX_BYTES
        value: "6442450944"
      - key: WEB3_ENABLE_LOCAL
        value: "false"
      - key: WEB3_BASE_RPC
        value: https://sepolia.base.org
      - key: WEB3_PUBLIC_ORIGIN
        value: https://app.ziipa.com
      - key: IPFS_PUBLIC
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: WEB3_REGISTRY_JSON
        sync: false
      - key: MODERATOR_EMAILS
        sync: false
      # New sync:false values must be added manually to an existing service;
      # Render prompts for them only when initially creating a blueprint.
      - key: ZIIPA_PROXY_SECRET
        sync: false
      - key: LIVEPEER_API_KEY
        sync: false
      - key: PUBLISHING_ENCRYPTION_KEY
        sync: false
      - key: PUBLISHING_API_ORIGIN
        value: https://ziipa.com
      - key: PUBLISHING_APPROVED_ORIGINS
        value: https://ziipa.com
      - key: PUBLISHING_PORTAL_URL
        value: https://ziipa.com/portal
      - key: PUBLISHING_ALLOW_INSECURE_LOCALHOST
        value: "false"
      - key: PUBLISHING_YOUTUBE_CLIENT_ID
        sync: false
      - key: PUBLISHING_YOUTUBE_CLIENT_SECRET
        sync: false
      - key: PUBLISHING_YOUTUBE_PUBLIC_APPROVED
        sync: false
      - key: PUBLISHING_TIKTOK_CLIENT_KEY
        sync: false
      - key: PUBLISHING_TIKTOK_CLIENT_SECRET
        sync: false
      - key: PUBLISHING_TIKTOK_PUBLIC_APPROVED
        sync: false
      - key: PUBLISHING_TIKTOK_VERIFIED_MEDIA_ORIGINS
        sync: false
      - key: PUBLISHING_META_CLIENT_ID
        sync: false
      - key: PUBLISHING_META_CLIENT_SECRET
        sync: false
      - key: PUBLISHING_META_GRAPH_VERSION
        sync: false
      - key: PUBLISHING_META_MEDIA_ORIGINS
        sync: false
      - key: PUBLISHING_META_PUBLIC_APPROVED
        sync: false
      - key: PUBLISHING_TWITCH_CLIENT_ID
        sync: false
      - key: PUBLISHING_TWITCH_CLIENT_SECRET
        sync: false
      - key: PUBLISHING_BLUESKY_ENABLED
        sync: false
      - key: PUBLISHING_BLUESKY_PRIVATE_JWK
        sync: false
      # Keep off until the free Oracle worker passes hosted/ARM64 acceptance.
      # Enable through a reviewed deployment on both API and worker afterward.
      - key: RENDER_ENABLED
        value: "false"
      - key: RENDER_TIMEOUT_SECONDS
        value: "180"
