# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free demo API for the Ziipa hybrid stack. Durable state lives in the
# externally managed Neon, Upstash, Cloudflare R2, and Pinata services.
services:
  - type: web
    name: ziipa-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: FRONTEND_ORIGIN
        value: https://ziipa.com,https://www.ziipa.com
      - key: MOBILE_WEB_ORIGIN
        value: https://app.ziipa.com
      - key: API_PUBLIC_ORIGIN
        value: https://api.ziipa.com
      - key: PUBLIC_APP_URL
        value: https://ziipa.com
      - key: EMAIL_FROM
        value: Ziipa <accounts@ziipa.com>
      - key: SECURE_COOKIES
        value: "true"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: ENABLE_DEMO_CATALOG
        value: "false"
      - key: MEDIA_STORAGE_BACKEND
        value: r2
      - key: R2_BUCKET_NAME
        value: ziipa-media
      - key: WEB3_ENABLE_LOCAL
        value: "false"
      - key: WEB3_BASE_RPC
        value: https://sepolia.base.org
      - key: WEB3_PUBLIC_ORIGIN
        value: https://app.ziipa.com
      - key: IPFS_PUBLIC
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: WEB3_REGISTRY_JSON
        sync: false
      - key: MODERATOR_EMAILS
        sync: false
