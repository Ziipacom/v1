# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint for the Ziipa monorepo.
# Paid persistent resources are intentional: uploads, sessions, and IPFS pins
# must survive deploys and restarts. Review the estimated cost before applying.
previews:
  generation: manual

services:
  - type: web
    name: ziipa-v1-web
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: ziipa-v1-api
          property: hostport

  - type: web
    name: ziipa-v1-api
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.lock.txt
    preDeployCommand: python render_migrate.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: ziipa-media
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ziipa-v1-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ziipa-v1-cache
          property: connectionString
      - key: IPFS_API_URL
        fromService:
          type: pserv
          name: ziipa-v1-ipfs
          property: hostport
      - key: FRONTEND_ORIGIN
        value: https://ziipa-v1-web.onrender.com,https://ziipa.com,https://www.ziipa.com
      - key: MOBILE_WEB_ORIGIN
        value: https://ziipa-v1-mobile.onrender.com
      - key: WEB3_PUBLIC_ORIGIN
        value: https://ziipa-v1-mobile.onrender.com
      - key: UPLOADS_DIR
        value: /opt/render/project/src/backend/uploads
      - key: SECURE_COOKIES
        value: "true"
      - key: ENABLE_DEMO_CATALOG
        value: "false"
      - key: WEB3_ENABLE_LOCAL
        value: "false"
      - key: IPFS_PUBLIC
        value: "false"
      - key: MODERATOR_EMAILS
        sync: false

  - type: web
    name: ziipa-v1-mobile
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    rootDir: mobile
    buildCommand: npm ci && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VARIANT
        value: preview
      - key: EXPO_PUBLIC_ENABLE_DEMO
        value: "false"
      - key: EXPO_PUBLIC_ENABLE_CONCEPTS
        value: "false"
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: ziipa-v1-api
          property: hostport

  - type: pserv
    name: ziipa-v1-ipfs
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    rootDir: ipfs
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    disk:
      name: ziipa-ipfs-data
      mountPath: /data/ipfs
      sizeGB: 10

  - type: keyvalue
    name: ziipa-v1-cache
    plan: 256mb
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: ziipa-v1-db
    plan: 0.5c-1g
    region: virginia
    postgresMajorVersion: "17"
    databaseName: ziipa
    user: ziipa
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []
