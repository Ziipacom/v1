<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Ziipa Facebook profile logo</title>
  <desc id="desc">Ziipa ribbon mark on a dark purple circular profile field.</desc>
  <defs>
    <radialGradient id="profile-field" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#251348"/>
      <stop offset="0.62" stop-color="#120b24"/>
      <stop offset="1" stop-color="#08060f"/>
    </radialGradient>
    <linearGradient id="profile-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.58" stop-color="#6423cf"/>
      <stop offset="1" stop-color="#7ee214"/>
    </linearGradient>
    <clipPath id="profile-crop"><circle cx="540" cy="540" r="500"/></clipPath>
    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The full square protects the logo when Facebook applies a circular crop. -->
  <rect id="background" width="1080" height="1080" fill="#0d0917"/>
  <circle id="profile-field-layer" cx="540" cy="540" r="500" fill="url(#profile-field)"/>
  <circle id="outer-ring" cx="540" cy="540" r="498" fill="none" stroke="url(#profile-ring)" stroke-width="8"/>

  <!-- Exact Ziipa app icon. Replace this linked file if the master mark changes. -->
  <g id="ziipa-mark" clip-path="url(#profile-crop)">
    <image x="120" y="120" width="840" height="840" preserveAspectRatio="xMidYMid meet" xlink:href="source-assets/ziipa-profile-base.png" filter="url(#mark-glow)"/>
  </g>
</svg>
