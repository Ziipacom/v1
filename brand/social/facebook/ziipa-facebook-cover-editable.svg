<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1640" height="624" viewBox="0 0 1640 624" role="img" aria-labelledby="title desc">
  <title id="title">Ziipa Facebook cover</title>
  <desc id="desc">Ziipa logo and Less limits. More possible. tagline over an energetic purple and lime creator-network background.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0917" stop-opacity="0.97"/>
      <stop offset="0.38" stop-color="#0d0917" stop-opacity="0.78"/>
      <stop offset="0.68" stop-color="#0d0917" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0d0917" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee214"/>
      <stop offset="1" stop-color="#6423cf"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Layer 1: generated campaign background. Replace this linked file to change the scene. -->
  <image id="campaign-background" x="0" y="0" width="1640" height="624" preserveAspectRatio="xMidYMid slice" xlink:href="source-assets/ziipa-cover-background.png"/>

  <!-- Layer 2: contrast treatment. Change opacity or stops in #shade to rebalance the design. -->
  <rect id="left-shade" width="1640" height="624" fill="url(#shade)"/>
  <rect id="accent-line-glow" x="360" y="470" width="300" height="5" rx="2.5" fill="#7ee214" opacity="0.28" filter="url(#softGlow)"/>
  <rect id="accent-line" x="360" y="470" width="300" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Layer 3: exact Ziipa production logo. Replace the linked PNG if the master logo changes. -->
  <image id="ziipa-logo" x="360" y="156" width="520" height="171" preserveAspectRatio="xMinYMid meet" xlink:href="source-assets/ziipa-logo.png"/>

  <!-- Layer 4: editable campaign copy. -->
  <g id="campaign-copy" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#ffffff">
    <text x="360" y="400" font-size="48" font-weight="500" letter-spacing="-1.2">Less limits. More possible.</text>
    <text x="360" y="446" font-size="22" font-weight="600" letter-spacing="3.2" fill="#d8c9ff">ZIIPA.COM</text>
  </g>
</svg>
