name: Ziipa checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - name: Install shared Studio dependencies
        run: npm ci
        working-directory: mobile
      - run: npm run build
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run --config dist/server/wrangler.json

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ziipa
          POSTGRES_PASSWORD: ziipa_test
          POSTGRES_DB: ziipa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ziipa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      ipfs:
        image: ipfs/kubo:v0.43.0
        ports:
          - 5001:5001
        options: >-
          --health-cmd "ipfs id"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ziipa:ziipa_test@127.0.0.1:5432/ziipa
      REDIS_URL: redis://127.0.0.1:6379/15
      IPFS_API_URL: http://127.0.0.1:5001
      FRONTEND_ORIGIN: http://localhost:5178
      MOBILE_WEB_ORIGIN: http://localhost:8082
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            backend/atproto_bridge/package-lock.json
      - run: npm ci
        working-directory: contracts
      - name: Install the pinned AT Protocol OAuth bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend/atproto_bridge
      - name: Check official OAuth SDK integration with mocked provider traffic
        run: npm test
        working-directory: backend/atproto_bridge
      - name: Install media rendering runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: npm run compile
        working-directory: contracts
      - name: Start local EVM for API integration tests
        working-directory: contracts
        run: |
          npm run node > hardhat.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -X POST http://127.0.0.1:8545 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat hardhat.log
          exit 1
      - run: npm run deploy:local
        working-directory: contracts
      - run: python render_migrate.py
      - run: python -m pytest -q
      - run: docker build -t ziipa-api-ci .
      - name: Verify actual rendering in the production Linux image
        run: docker run --rm --network none --cpus 1 --memory 1g --memory-swap 1g -e ZIIPA_RENDER_RESOURCE_TEST=1 --mount "type=bind,source=$PWD/test_rendering.py,target=/app/test_rendering.py,readonly" ziipa-api-ci python -m pytest test_rendering.py -q -p no:cacheprovider

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Start local EVM
        run: |
          npm run node > hardhat.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -X POST http://127.0.0.1:8545 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat hardhat.log
          exit 1
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run render:build
        env:
          APP_VARIANT: preview
          EXPO_PUBLIC_ENABLE_DEMO: "false"
          EXPO_PUBLIC_ENABLE_CONCEPTS: "false"
