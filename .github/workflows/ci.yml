name: Ziipa checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - name: Install shared Studio dependencies
        run: npm ci
        working-directory: mobile
      - run: npm run build
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run --config dist/server/wrangler.json

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ziipa
          POSTGRES_PASSWORD: ziipa_test
          POSTGRES_DB: ziipa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ziipa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      ipfs:
        image: ipfs/kubo:v0.43.0
        ports:
          - 5001:5001
        options: >-
          --health-cmd "ipfs id"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ziipa:ziipa_test@127.0.0.1:5432/ziipa
      REDIS_URL: redis://127.0.0.1:6379/15
      IPFS_API_URL: http://127.0.0.1:5001
      FRONTEND_ORIGIN: http://localhost:5178
      MOBILE_WEB_ORIGIN: http://localhost:8082
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            backend/atproto_bridge/package-lock.json
      - run: npm ci
        working-directory: contracts
      - name: Install the pinned AT Protocol OAuth bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend/atproto_bridge
      - name: Check official OAuth SDK integration with mocked provider traffic
        run: npm test
        working-directory: backend/atproto_bridge
      - name: Install media rendering runtime
        run: |
          # FFmpeg needs Ubuntu packages, not the runner's unrelated third-party
          # repositories. Keep the configured Ubuntu mirrors and trust settings.
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          test -s "$ubuntu_sources"
          apt_options=(-o "Dir::Etc::sourcelist=$ubuntu_sources" -o "Dir::Etc::sourceparts=-")
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: npm run compile
        working-directory: contracts
      - name: Start local EVM for API integration tests
        working-directory: contracts
        run: |
          npm run node > hardhat.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -X POST http://127.0.0.1:8545 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat hardhat.log
          exit 1
      - run: npm run deploy:local
        working-directory: contracts
      - run: python render_migrate.py
      - run: python -m pytest -q
      - run: docker build -t ziipa-api-ci .
      - name: Verify actual rendering in the production Linux image
        run: |
          set -euo pipefail
          docker run --rm --network none --cpus 1 --memory 1g --memory-swap 1g \
            -e ZIIPA_RENDER_RESOURCE_TEST=1 \
            --mount "type=bind,source=$PWD/test_rendering.py,target=/app/test_rendering.py,readonly" \
            --mount "type=bind,source=$PWD/test_timeline_rendering.py,target=/app/test_timeline_rendering.py,readonly" \
            --mount "type=bind,source=$PWD/test_creation_campaigns.py,target=/app/test_creation_campaigns.py,readonly" \
            --mount "type=bind,source=$PWD/test_overlay_layout.py,target=/app/test_overlay_layout.py,readonly" \
            ziipa-api-ci python -m pytest test_rendering.py test_overlay_layout.py -q -p no:cacheprovider \
            | tee "$RUNNER_TEMP/ziipa-linux-render.log"
          ! grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/ziipa-linux-render.log"

  native-arm-worker:
    # Standard ARM runners are free for public repositories. Fail closed if a
    # fork becomes private or repository visibility is absent from the event.
    if: ${{ github.event.repository.visibility == 'public' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require native ARM and build the production image
        timeout-minutes: 15
        run: |
          set -euo pipefail
          case "$(uname -m)" in aarch64|arm64) ;; *) exit 1 ;; esac
          docker build --platform linux/arm64 --tag ziipa-native-arm-ci \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file backend/Dockerfile backend
          test "$(docker image inspect --format '{{.Architecture}}' ziipa-native-arm-ci)" = arm64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' ziipa-native-arm-ci)" = "$GITHUB_SHA"
      - name: Native ARM 90-second rendering and overlay acceptance
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 1 --memory 1g --memory-swap 1g --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=268435456,mode=1777 \
            --mount "type=bind,source=$PWD/backend/test_rendering.py,target=/app/test_rendering.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_timeline_rendering.py,target=/app/test_timeline_rendering.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_creation_campaigns.py,target=/app/test_creation_campaigns.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_overlay_layout.py,target=/app/test_overlay_layout.py,readonly" \
            -e DATABASE_URL=sqlite:// -e REDIS_URL=redis://127.0.0.1:6379/0 -e ENVIRONMENT=test \
            -e ZIIPA_RENDER_RESOURCE_TEST=1 \
            ziipa-native-arm-ci python -m pytest test_rendering.py test_overlay_layout.py \
            -q -s -p no:cacheprovider --basetemp=/tmp/acceptance \
            | tee "$RUNNER_TEMP/ziipa-arm-render.log"
          # Missing FFmpeg/fonts must fail acceptance, not silently skip it.
          ! grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/ziipa-arm-render.log"
      - name: Native ARM 100 MiB private recording import acceptance
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 0.25 --memory 512m --memory-swap 512m --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=134217728,mode=1777 \
            --mount "type=bind,source=$PWD/deploy/oracle-free,target=/deploy/oracle-free,readonly" \
            --mount "type=bind,source=$PWD/backend/test_oracle_deployment.py,target=/app/test_oracle_deployment.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_live_recordings.py,target=/app/test_live_recordings.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_rendering.py,target=/app/test_rendering.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_render_deployment.py,target=/app/test_render_deployment.py,readonly" \
            -e DATABASE_URL=sqlite:// -e REDIS_URL=redis://127.0.0.1:6379/0 -e ENVIRONMENT=test \
            -e ZIIPA_ORACLE_WORKFLOW_RESOURCE_TEST=1 \
            ziipa-native-arm-ci python -m pytest test_oracle_deployment.py \
            -k maximum_recording_import -q -s -p no:cacheprovider --basetemp=/tmp/acceptance \
            | tee "$RUNNER_TEMP/ziipa-arm-recording.log"
          ! grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/ziipa-arm-recording.log"
      - name: Native ARM isolated workflow and push protocols
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 0.25 --memory 512m --memory-swap 512m --pids-limit 64 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=134217728,mode=1777 \
            --mount "type=bind,source=$PWD/backend/test_live_recordings.py,target=/app/test_live_recordings.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_rendering.py,target=/app/test_rendering.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_notifications.py,target=/app/test_notifications.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_notification_integration.py,target=/app/test_notification_integration.py,readonly" \
            --mount "type=bind,source=$PWD/backend/test_recording_readiness.py,target=/app/test_recording_readiness.py,readonly" \
            -e DATABASE_URL=sqlite:// -e REDIS_URL=redis://127.0.0.1:6379/0 -e ENVIRONMENT=test \
            ziipa-native-arm-ci python -m pytest test_live_recordings.py test_notifications.py \
            test_notification_integration.py test_recording_readiness.py \
            -q -s -p no:cacheprovider --basetemp=/tmp/acceptance \
            | tee "$RUNNER_TEMP/ziipa-arm-protocols.log"
          ! grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/ziipa-arm-protocols.log"
      # These synthetic, offline tests do not start a worker, access production
      # data, or replace resource acceptance on the eventual Oracle host.

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Start local EVM
        run: |
          npm run node > hardhat.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -X POST http://127.0.0.1:8545 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat hardhat.log
          exit 1
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run render:build
        env:
          APP_VARIANT: preview
          EXPO_PUBLIC_ENABLE_DEMO: "false"
          EXPO_PUBLIC_ENABLE_CONCEPTS: "false"
