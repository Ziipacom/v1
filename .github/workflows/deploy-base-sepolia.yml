name: Deploy reviewed contracts to Base Sepolia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: base-sepolia
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run deploy:base-sepolia
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.BASE_SEPOLIA_DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC }}
          CHAIN_ID: "84532"
      - uses: actions/upload-artifact@v4
        with:
          name: base-sepolia-deployment-registry
          path: contracts/.local/web3-deployments.json
          if-no-files-found: error
